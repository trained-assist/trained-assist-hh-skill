name: HH CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
  staging-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Replay isolated cold-search lifecycle with HH transport fixtures
        run: npx vitest run tests/hh-cold-search-transport.test.js tests/hh-proactive-multi-user-isolation.test.js tests/hh-evidence-evaluator.test.js tests/hh-evaluator-source.test.js
