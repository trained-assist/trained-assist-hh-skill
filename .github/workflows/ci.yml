name: HH CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hh-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    uses: ./.github/workflows/skill-ci-reusable.yml
    with:
      suite: unit
  contract:
    uses: ./.github/workflows/skill-ci-reusable.yml
    with:
      suite: contract
  browser:
    uses: ./.github/workflows/skill-ci-reusable.yml
    with:
      suite: staging
  ci:
    name: ci
    needs: [unit, contract]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful unit and consumer-contract suites
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
        run: test "$UNIT_RESULT" = success && test "$CONTRACT_RESULT" = success
  staging-gate:
    name: staging-gate
    needs: browser
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful executable browser scenario
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BROWSER_RESULT" = success
