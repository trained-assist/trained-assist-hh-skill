name: HH CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hh-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # L1 — contract: mcp.manifest.json vs the mcp-skill-sources schema, artifact
  # digest, tool-name parity with the real server's tools/list.
  contract:
    uses: ./.github/workflows/skill-ci-reusable.yml
    with:
      suite: contract
  # L2 — behavior: the real MCP server over stdio against replay fixtures.
  behavior:
    uses: ./.github/workflows/skill-ci-reusable.yml
    with:
      suite: behavior
  # L3 — guards: static mirrors of the core gates (no Claude spawn, timeouts,
  # data-path resolver, credential modes, secrets never logged).
  guards:
    uses: ./.github/workflows/skill-ci-reusable.yml
    with:
      suite: guards
  # Domain unit suite (vitest + legacy node runners), hermetic.
  unit:
    uses: ./.github/workflows/skill-ci-reusable.yml
    with:
      suite: unit
  # Browser journey (Chromium) — same replay, real generated HTML.
  browser:
    uses: ./.github/workflows/skill-ci-reusable.yml
    with:
      suite: staging
  # Domain-skill conformance gate (core #1440): required artifacts, manifest vs
  # schema, mandatory suites, L3 static guards. The testkit comes from public
  # core at a PINNED revision — bumping TESTKIT_REF = accepting new gate rules.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TESTKIT_REF: 091218057ee94de60bd057b8027b339aa49c4ae9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: trained-assist/trained-assist-agent
          ref: ${{ env.TESTKIT_REF }}
          path: .testkit-core
          sparse-checkout: packages/mcp-skill-testkit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      # The kit's peer deps (ajv) resolve from this repo's node_modules.
      - name: mcp-skill-conformance
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: node .testkit-core/packages/mcp-skill-testkit/bin/mcp-skill-conformance.js .
  ci:
    name: ci
    needs: [contract, behavior, guards, unit, conformance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful contract, behavior, guards, unit and conformance
        env:
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          BEHAVIOR_RESULT: ${{ needs.behavior.result }}
          GUARDS_RESULT: ${{ needs.guards.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
        run: test "$CONTRACT_RESULT" = success && test "$BEHAVIOR_RESULT" = success && test "$GUARDS_RESULT" = success && test "$UNIT_RESULT" = success && test "$CONFORMANCE_RESULT" = success
  staging-gate:
    name: staging-gate
    needs: [contract, behavior, guards, unit, browser, conformance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful upstream suites
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          BEHAVIOR_RESULT: ${{ needs.behavior.result }}
          GUARDS_RESULT: ${{ needs.guards.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
        run: test "$CONTRACT_RESULT" = success && test "$BEHAVIOR_RESULT" = success && test "$GUARDS_RESULT" = success && test "$UNIT_RESULT" = success && test "$BROWSER_RESULT" = success && test "$CONFORMANCE_RESULT" = success
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      # Deterministic replay only: real MCP server + fixtures under the
      # isolation guard. The LLM judge belongs to staging, never here.
      - run: npm run test:staging
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-results/
          retention-days: 7
